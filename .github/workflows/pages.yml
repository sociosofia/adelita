name: Publicar PWA Adelita

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site
        run: |
          rm -rf _site _tmp
          mkdir _site
          if [ -f Adelita_PWA_v0.5.zip ]; then
            unzip -q Adelita_PWA_v0.5.zip -d _tmp
            cp -a _tmp/Adelita_PWA_v0.5/. _site/
          else
            cp -a index.html manifest.webmanifest sw.js METADADOS_BANCOS.json assets _site/ 2>/dev/null || true
          fi
          # O ZIP guarda os bancos; estes arquivos ficam sob controle do repo
          # para podermos corrigir o PWA sem reenviar 17 MB a cada ajuste.
          cp sw.js _site/sw.js
          python scripts/hotfix_pwa.py
          python scripts/hotfix_keep_question_together.py
          python scripts/hotfix_docx_export.py
          python scripts/hotfix_builder_v1.py
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
